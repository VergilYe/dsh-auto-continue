# dsh-auto-continue v2 — keep a turn from closing on an unfinished reply.
#
# Four behaviours, all optional:
#   1. streamGuard — on `llm/stream`, a silent stall or a mid-thought stop becomes a
#      retryable error, so DSH's own retry re-sends inside the same step.
#   2. completionProtocol — injects one system-prompt section asking for an explicit
#      end-of-reply fenced block (```done / ```ask). Declared ⇒ close; missing after
#      real work ⇒ one short push.
#   3. heuristic scopes (retryScope / truncationScope / extendedScope) — used when the
#      protocol is off.
#   4. overloadReconnect — once a provider's own bounded retry (5 attempts by default)
#      is spent on a 429/529 "overloaded" failure (Zhipu code 1305, "访问量过大"),
#      re-send every 10s with no ceiling instead of closing the turn as failed.
#      Set `overloadMaxWaitMs` to cap the total wait; 0 (default) means wait as long as
#      it takes. An aborted turn is never held open.
#
# No provider/model route and no credential is preset here. `allowModels` is left unset,
# which means every route: a fresh install must work on whichever model the user runs.
# To narrow it, override this row's config in the profile patch layer (see "只想对某些模型
# 生效" in README.md) rather than here, so an upgrade cannot wipe that choice.
- insert:
    - id: auto-continue
      name: "@vergilye/dsh-auto-continue"
      config:
        enabled: true
        maxNudges: 2
        delayMs: 0
        dryRun: false
        completionProtocol: true
        markerStyle: fence-check
        # An `ask` block still closes the turn when a closing sentence follows it. `done`
        # keeps the strict "must be the last thing" rule. Set to false for the old
        # behaviour, where a trailing sentence made the question read as undeclared.
        askClosesDespiteTrailingProse: true
        streamGuard: true
        streamIdleMs: 90000
        maxGuardRetries: 1
        retryScope: true
        truncationScope: true
        extendedScope: true
        overloadReconnect: true
        overloadRetryIntervalMs: 10000
        overloadMaxWaitMs: 0
        logDecisions: true
