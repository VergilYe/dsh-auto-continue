url: https://github.com/VergilYe/dsh-auto-continue
name: VergilYe/dsh-auto-continue
category: session
description:
  en: 'Keeps a turn alive instead of closing it early: a stream guard turns silent truncation into an in-step retry, a completion protocol asks the model to declare how each turn ended, and once the provider''s own retries are spent on a 429/529 overload it reconnects every 10 seconds with no ceiling instead of failing the turn.'
  zh: '避免轮次过早关闭：把静默截断的流转成同一步内可重试的失败，要求模型在每轮结束时声明收尾方式；遇到 429/529（含 GLM 1305「访问量过大」）在既有重试耗尽后每 10 秒无限重连，不再提示本轮运行失败。'
