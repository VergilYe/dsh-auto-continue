url: https://github.com/VergilYe/dsh-auto-continue
name: VergilYe/dsh-auto-continue
category: session
description:
  en: 'Keeps a turn from ending too early: a provider overload (429/529 overloaded_error, GLM code 1305) is retried every 10 seconds with no attempt ceiling instead of failing the turn, a silently truncated reply becomes an in-step retry, and the model must declare with a done/ask block how each turn ended so a plan-only reply cannot close it.'
  zh: '让轮次不提前结束：上游过载（429/529 overloaded_error、GLM 错误码 1305）在 DSH 自带重试耗尽后每 10 秒无限重连而不是判死这一轮；静默截断的回复自动在同步内重发；模型必须用 done/ask 块声明收尾方式，只写计划的回复关不掉这一轮。'
